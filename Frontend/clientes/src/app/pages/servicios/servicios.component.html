<app-page-title [heading]="heading" [subheading]="subheading" [icon]="icon"></app-page-title>

<div class="main-card mb-3 card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Servicios Registrados</span>
    <button class="btn btn-primary btn-sm" (click)="nuevoServicio()">
      <i class="pe-7s-plus me-1"></i> Nuevo Servicio
    </button>
  </div>
  <div class="table-responsive">
    <table class="align-middle mb-0 table table-borderless table-striped table-hover">
      <thead>
        <tr>
          <th class="text-center">#</th>
          <th>Servicio</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let srv of servicios">
          <td class="text-center text-muted">{{ srv.id }}</td>
          <td class="fw-bold">{{ srv.nombre }}</td>
          <td>{{ srv.descripcion }}</td>
          <td>${{ srv.precio | number:'1.2-2' }}</td>
          <td>
            <span class="badge" [ngClass]="srv.activo ? 'bg-success' : 'bg-danger'">
              {{ srv.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-1" (click)="editarServicio(srv.id)">
              Editar
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="eliminarServicio(srv.id)">
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="servicios.length === 0">
          <td colspan="6" class="text-center py-3">No hay servicios registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
