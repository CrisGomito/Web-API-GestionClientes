<app-page-title [heading]="heading" [subheading]="subheading" [icon]="icon"></app-page-title>

<div class="main-card mb-3 card">
  <div class="card-body">
    <h5 class="card-title">{{ esEdicion ? 'Editar Servicio' : 'Nuevo Servicio' }}</h5>
    <form [formGroup]="formServicio" (ngSubmit)="guardar()">
      <div class="mb-3">
        <label class="form-label">Nombre del Servicio</label>
        <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" formControlName="descripcion" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Precio</label>
          <input type="number" step="0.01" class="form-control" formControlName="precio">
        </div>
        <div class="col-md-6 mb-3 d-flex align-items-center">
          <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" formControlName="activo" id="checkActivo">
            <label class="form-check-label" for="checkActivo">Servicio Activo</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="formServicio.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
