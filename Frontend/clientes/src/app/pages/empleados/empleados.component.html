<app-page-title [heading]="heading" [subheading]="subheading" [icon]="icon"></app-page-title>

<div class="main-card mb-3 card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Lista de Empleados</span>
    <button class="btn btn-primary btn-sm" (click)="nuevoEmpleado()">
      <i class="pe-7s-plus me-1"></i> Nuevo Empleado
    </button>
  </div>
  <div class="table-responsive">
    <table class="align-middle mb-0 table table-borderless table-striped table-hover">
      <thead>
        <tr>
          <th class="text-center">#</th>
          <th>Nombre Completo</th>
          <th>Cédula</th>
          <th>Cargo</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Sueldo</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of empleados">
          <td class="text-center text-muted">{{ emp.id }}</td>
          <td>{{ emp.nombres }} {{ emp.apellidos }}</td>
          <td>{{ emp.cedula }}</td>
          <td><span class="badge bg-info">{{ emp.cargo }}</span></td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.telefono }}</td>
          <td>${{ emp.sueldo | number:'1.2-2' }}</td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-1" (click)="editarEmpleado(emp.id)">
              Editar
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="eliminarEmpleado(emp.id)">
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="empleados.length === 0">
          <td colspan="8" class="text-center py-3">No hay empleados registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
