<app-page-title [heading]="heading" [subheading]="subheading" [icon]="icon"></app-page-title>

<div class="main-card mb-3 card">
  <div class="card-body">
    <h5 class="card-title">{{ esEdicion ? 'Editar Cliente' : 'Registrar Cliente' }}</h5>
    <form [formGroup]="formCliente" (ngSubmit)="guardar()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombres</label>
          <input type="text" class="form-control" formControlName="nombres" placeholder="Nombres del cliente">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Apellidos</label>
          <input type="text" class="form-control" formControlName="apellidos" placeholder="Apellidos del cliente">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">RUC / Cédula</label>
          <input type="text" class="form-control" formControlName="ruc" placeholder="10 a 13 dígitos">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="correo@ejemplo.com">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" formControlName="telefono" placeholder="09xxxxxxxx">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Dirección</label>
          <input type="text" class="form-control" formControlName="direccion" placeholder="Dirección completa">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary me-2" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="formCliente.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
